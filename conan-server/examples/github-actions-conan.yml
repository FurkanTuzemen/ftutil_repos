# Example GitHub Actions job that uses the Pi's Conan remote as a binary
# cache: prebuilt dependencies are downloaded instead of rebuilt, and anything
# built from source is uploaded back so the next run hits the cache.
# A live, working version of this is FurkanTuzemen/conan_server_test.
#
# One-time setup in the consuming repo (Settings -> Secrets and variables -> Actions):
#   variable CONAN_REMOTE_URL       http://100.85.113.90:9300   (Pi over Tailscale)
#   variable CONAN_REMOTE_USER      ci
#   secret   CONAN_REMOTE_PASSWORD  from .env on the Pi
#   secret   TS_OAUTH_CLIENT_ID     Tailscale OAuth client allowed to create
#   secret   TS_OAUTH_SECRET        "tag:ci" nodes (tailscale/github-action)
#
# Tailscale lets the hosted runner reach the Pi without exposing the server
# (plain HTTP) to the internet. CONAN_PUBLIC_HOSTNAME in the Pi's .env must be
# the tailnet address, because it is baked into the file-transfer URLs.

name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Drop this step if the runner is self-hosted on the Pi's LAN.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Must equal CONAN_SERVER_VERSION in ftutil_repos/conan-server/versions.env
      # (= the ConanAutomation toolchain pin).
      - name: Install Conan
        run: pipx install conan==2.7.1

      - name: Register the self-hosted remote
        run: |
          conan profile detect --force
          conan remote add ftpi "${{ vars.CONAN_REMOTE_URL }}"
          conan remote login ftpi "${{ vars.CONAN_REMOTE_USER }}" -p "${{ secrets.CONAN_REMOTE_PASSWORD }}"

      - name: Install dependencies (cache hit = download, miss = build)
        run: conan install . --build=missing

      # Packages already on the server are skipped.
      - name: Upload new binaries to the cache
        run: conan upload "*" -r ftpi --confirm
