# Run from this directory (conan-server/linux). Values come from .env (generated by
# bootstrap.sh; versions copied from versions.env on every bootstrap).
# Project name; overridden by COMPOSE_PROJECT_NAME (from .env) for test instances.
name: conan-server

services:
  conan-server:
    build:
      context: ./server
      args:
        CONAN_SERVER_VERSION: ${CONAN_SERVER_VERSION:?run bootstrap.sh - it copies versions.env into .env}
        PYTHON_VERSION: ${CONAN_PYTHON_VERSION:?run bootstrap.sh - it copies versions.env into .env}
    image: ftutil/conan-server:${CONAN_SERVER_VERSION}
    container_name: ${CONAN_CONTAINER_NAME:-conan-server}
    restart: unless-stopped
    init: true
    ports:
      - "${CONAN_PUBLIC_PORT:-9300}:9300"
    environment:
      CONAN_SERVER_USERS: ${CONAN_SERVER_USERS:?set it in .env}
      CONAN_WRITE_USERS: ${CONAN_WRITE_USERS:-}
      CONAN_READ_USERS: ${CONAN_READ_USERS:-}
      CONAN_JWT_SECRET: ${CONAN_JWT_SECRET:?set it in .env}
      CONAN_UPDOWN_SECRET: ${CONAN_UPDOWN_SECRET:?set it in .env}
      CONAN_PUBLIC_HOSTNAME: ${CONAN_PUBLIC_HOSTNAME:?set it in .env}
      CONAN_PUBLIC_PORT: ${CONAN_PUBLIC_PORT:-9300}
    volumes:
      # Package storage on the external disk. create_host_path is off so a
      # missing disk mount fails loudly instead of silently writing packages
      # to the SD card.
      - type: bind
        source: ${CONAN_DATA_DIR:?set it in .env}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9300/v1/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # The healthcheck logs a ping line every 30s; cap the log so it can't
    # slowly fill the SD card.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
